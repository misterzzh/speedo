<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>速度表</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="速度表">
<meta name="theme-color" content="#05070a">
<style>
  :root{
    --bg: #05070a;
    --panel: #0c1016;
    --line: #1c242e;
    --amber: #ffb547;
    --green: #6be38a;
    --dim: #4a5568;
    --red: #ff5c5c;
    --font-num: 'SF Mono', 'Menlo', 'Courier New', monospace;
    --font-label: -apple-system, 'Helvetica Neue', sans-serif;
  }
  *{ box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    font-family:var(--font-label);
    overflow:hidden;
  }
  body{
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height:100vh;
  }
  .status{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 18px 4px;
    font-size:11px; letter-spacing:.04em; color:var(--dim);
  }
  .status .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--dim); margin-right:6px; vertical-align:middle;
  }
  .status.ok .dot{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .status.err .dot{ background:var(--red); box-shadow:0 0 6px var(--red); }

  .readouts{
    flex:1; display:flex; flex-direction:column;
    justify-content:center; gap: 4vh;
    padding: 0 6vw;
  }
  .field{
    border-top:1px solid var(--line);
    padding-top: 2.2vh;
  }
  .field-head{
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .field-label{
    font-size:13px; color:var(--dim); letter-spacing:.08em;
  }
  .unit-toggle{
    display:flex; gap:8px;
  }
  .unit-btn{
    font-family:var(--font-num);
    font-size:13px; color:var(--dim);
    background:transparent; border:1px solid var(--line);
    border-radius:6px; padding:4px 10px;
    transition: color .15s, border-color .15s;
  }
  .unit-btn.active{
    color: var(--amber);
    border-color: var(--amber);
  }
  .field.alt .unit-btn.active{ color: var(--green); border-color: var(--green); }

  .value-row{
    display:flex; align-items:baseline; gap:14px; margin-top:2px;
  }
  .value{
    font-family:var(--font-num); font-weight:600;
    font-size: 22vw; line-height:1;
    color: var(--amber);
    letter-spacing:-0.01em;
    font-variant-numeric: tabular-nums;
  }
  .field.alt .value{ color: var(--green); }
  .value.stale{ opacity:.35; }
  .unit-suffix{
    font-family:var(--font-num); font-size:16px; color:var(--dim);
    padding-bottom:1.5vh;
  }

  .footer{
    text-align:center; padding: 8px 0 14px;
    font-size:10px; color:var(--dim); letter-spacing:.06em;
  }

  .overlay{
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:0 12vw; text-align:center; z-index:10;
  }
  .overlay h1{ font-size:17px; color:#e6e9ee; font-weight:600; margin:0; }
  .overlay p{ font-size:14px; color:var(--dim); line-height:1.6; margin:0; }
  .overlay button{
    font-family:var(--font-label); font-size:15px; font-weight:600;
    color:var(--bg); background:var(--amber); border:none;
    border-radius:10px; padding:13px 28px; margin-top:6px;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

  <div id="overlay" class="overlay">
    <h1>速度 · 高度表</h1>
    <p>需要授权定位权限才能读取GPS速度与高度。授权一次后,飞行模式下也能正常显示。</p>
    <button id="startBtn">开始</button>
    <p id="overlayMsg" style="color:var(--red); display:none;"></p>
  </div>

  <div class="status" id="status">
    <div><span class="dot"></span><span id="statusText">等待定位…</span></div>
    <div id="accuracyText">精度 --</div>
  </div>

  <div class="readouts">
    <div class="field spd">
      <div class="field-head">
        <div class="field-label">速度 SPEED</div>
        <div class="unit-toggle" id="speedUnitToggle">
          <button class="unit-btn active" data-unit="kph">KPH</button>
          <button class="unit-btn" data-unit="kn">KT</button>
        </div>
      </div>
      <div class="value-row">
        <div class="value stale" id="speedValue">--</div>
      </div>
    </div>

    <div class="field alt">
      <div class="field-head">
        <div class="field-label">高度 ALTITUDE</div>
        <div class="unit-toggle" id="altUnitToggle">
          <button class="unit-btn active" data-unit="m">M</button>
          <button class="unit-btn" data-unit="ft">FT</button>
        </div>
      </div>
      <div class="value-row">
        <div class="value stale" id="altValue">--</div>
      </div>
    </div>
  </div>

  <div class="footer">GPS · 无需网络 · 每 0.5 秒刷新</div>

<script>
  let speedUnit = 'kph';   // kph | kn
  let altUnit = 'm';       // m | ft
  let lastSpeedMs = null;  // meters/sec, raw from GPS
  let lastAltM = null;     // meters, raw from GPS
  let lastFixTime = 0;
  let watchId = null;

  const speedValueEl = document.getElementById('speedValue');
  const altValueEl = document.getElementById('altValue');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const accuracyText = document.getElementById('accuracyText');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');

  document.getElementById('speedUnitToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.unit-btn');
    if (!btn) return;
    speedUnit = btn.dataset.unit;
    setActive('speedUnitToggle', btn);
    render();
  });
  document.getElementById('altUnitToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('.unit-btn');
    if (!btn) return;
    altUnit = btn.dataset.unit;
    setActive('altUnitToggle', btn);
    render();
  });
  function setActive(groupId, btn){
    document.querySelectorAll('#' + groupId + ' .unit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function fmtSpeed(ms){
    if (ms === null || ms === undefined || isNaN(ms)) return '--';
    const v = ms < 0 ? 0 : ms;
    if (speedUnit === 'kph') return (v * 3.6).toFixed(0);
    return (v * 1.9438445).toFixed(0); // m/s -> knots
  }
  function fmtAlt(m){
    if (m === null || m === undefined || isNaN(m)) return '--';
    if (altUnit === 'm') return m.toFixed(0);
    return (m * 3.28084).toFixed(0);
  }

  function render(){
    speedValueEl.textContent = fmtSpeed(lastSpeedMs);
    altValueEl.textContent = fmtAlt(lastAltM);
    const stale = (Date.now() - lastFixTime) > 3000;
    speedValueEl.classList.toggle('stale', stale || lastSpeedMs === null);
    altValueEl.classList.toggle('stale', stale || lastAltM === null);
  }

  function onPosition(pos){
    lastFixTime = Date.now();
    lastSpeedMs = pos.coords.speed;
    lastAltM = pos.coords.altitude;
    statusEl.classList.add('ok');
    statusEl.classList.remove('err');
    statusText.textContent = '已定位';
    const acc = pos.coords.accuracy;
    accuracyText.textContent = '精度 ' + (acc ? ('±' + acc.toFixed(0) + 'm') : '--');
  }

  function onError(err){
    statusEl.classList.add('err');
    statusEl.classList.remove('ok');
    statusText.textContent = '定位失败: ' + (err.message || err.code);
  }

  function start(){
    if (!('geolocation' in navigator)){
      overlayMsg.style.display = 'block';
      overlayMsg.textContent = '此浏览器不支持定位功能。';
      return;
    }
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    });
    overlay.classList.add('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', start);

  // 每 0.5 秒刷新一次显示 (2Hz)
  setInterval(render, 500);
  render();

  // 注册Service Worker,实现离线缓存(联网成功打开一次后,飞行模式也能用)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
